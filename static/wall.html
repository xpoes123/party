<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the party — wall</title>
<link rel="stylesheet" href="/static/css/tokyo-night.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:
  radial-gradient(1200px 700px at 80% -10%, rgba(122,162,247,.10), transparent 60%),
  radial-gradient(1000px 700px at 0% 110%, rgba(187,154,247,.08), transparent 55%),
  var(--bg);font-family:"Inter",system-ui,sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;
  opacity:1;transition:opacity .5s ease}
#frame.fade{opacity:0}
.dots{position:fixed;bottom:22px;left:0;right:0;display:flex;gap:10px;justify-content:center;z-index:10}
.dots span{width:8px;height:8px;border-radius:50%;background:#2a2f45;transition:.3s}
.dots span.on{background:var(--blue);width:24px;border-radius:4px}
</style>
</head>
<body>
<iframe id="frame" src="/scene/songs"></iframe>
<div class="dots" id="dots"></div>
<script>
// add more scenes here as we build them. waitIdle scenes (arena) aren't cut
// mid-action — after `secs` the wall waits for the scene to signal a break.
const ALL=[
  {name:"music", url:"/scene/songs",       secs:22, always:true},
  {name:"arena", url:"/scene/arena",       secs:40, always:true, waitIdle:true},
  {name:"board", url:"/scene/leaderboard", secs:14, always:true},
  {name:"blobs", url:"/scene/blobs",       secs:26, always:true},
];
const frame=document.getElementById("frame"), dotsEl=document.getElementById("dots");
let deck=[], i=0, timer=null, capTimer=null, pendingNext=false;

async function buildDeck(){
  const out=[];
  for(const s of ALL){ if(s.always || (s.check && await s.check())) out.push(s); }
  deck=out.length?out:[ALL[0]];
  dotsEl.innerHTML=deck.map(()=>"<span></span>").join("");
}
function show(n){
  i=((n%deck.length)+deck.length)%deck.length;
  const s=deck[i];
  frame.classList.add("fade");
  setTimeout(()=>{ frame.src=s.url; }, 500);
  [...dotsEl.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  pendingNext=false; clearTimeout(timer); clearTimeout(capTimer);
  timer=setTimeout(()=>{
    if(s.waitIdle){ pendingNext=true; capTimer=setTimeout(next, 90000); } // wait for game to finish (generous cap)
    else next();
  }, s.secs*1000);
}
// scene (arena) tells us a game just finished -> safe to fade now
window.addEventListener("message", e=>{
  if(e.data && e.data.type==="scene-idle" && pendingNext){ pendingNext=false; clearTimeout(capTimer); next(); }
});
frame.onload=()=>frame.classList.remove("fade");
async function next(){ await buildDeck(); show(i+1); }

buildDeck().then(()=>{ [...dotsEl.children].forEach((d,k)=>d.classList.toggle("on",k===0));
  timer=setTimeout(next, deck[0].secs*1000); });
</script>
</body>
</html>
