<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the party — wall</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:
  radial-gradient(1200px 700px at 80% -10%, rgba(122,162,247,.10), transparent 60%),
  radial-gradient(1000px 700px at 0% 110%, rgba(187,154,247,.08), transparent 55%),
  #1a1b26;font-family:"Inter",system-ui,sans-serif}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;
  opacity:1;transition:opacity .5s ease}
#frame.fade{opacity:0}
.dots{position:fixed;bottom:22px;left:0;right:0;display:flex;gap:10px;justify-content:center;z-index:10}
.dots span{width:8px;height:8px;border-radius:50%;background:#2a2f45;transition:.3s}
.dots span.on{background:#7aa2f7;width:24px;border-radius:4px}
</style>
</head>
<body>
<iframe id="frame" src="/scene/graph"></iframe>
<div class="dots" id="dots"></div>
<script>
const ALL=[
  {name:"graph", url:"/scene/graph", secs:22, always:true},
  {name:"blobs", url:"/scene/blobs", secs:26, always:true},
  {name:"poll",  url:"/scene/poll",  secs:20, check:async()=>(await (await fetch("/polls")).json()).length>0},
  {name:"songs", url:"/scene/songs", secs:18, check:async()=>{
    const m=await (await fetch("/music/now")).json();
    if(m.playing || (m.queue && m.queue.length)) return true;
    return (await (await fetch("/songs")).json()).length>0;
  }},
];
const frame=document.getElementById("frame"), dotsEl=document.getElementById("dots");
let deck=[], i=0, timer=null;

async function buildDeck(){
  const out=[];
  for(const s of ALL){ if(s.always || (s.check && await s.check())) out.push(s); }
  deck=out.length?out:[ALL[0]];
  dotsEl.innerHTML=deck.map(()=>"<span></span>").join("");
}
function show(n){
  i=((n%deck.length)+deck.length)%deck.length;
  const s=deck[i];
  frame.classList.add("fade");
  setTimeout(()=>{ frame.src=s.url; }, 500);
  [...dotsEl.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  clearTimeout(timer); timer=setTimeout(next, s.secs*1000);
}
frame.onload=()=>frame.classList.remove("fade");
async function next(){ await buildDeck(); show(i+1); }

buildDeck().then(()=>{ [...dotsEl.children].forEach((d,k)=>d.classList.toggle("on",k===0));
  timer=setTimeout(next, deck[0].secs*1000); });
</script>
</body>
</html>
