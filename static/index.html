<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/static/cytoscape.min.js"></script>
<style>
:root{
  --bg:#0a0714; --bg2:#150b28; --card:#1b1030; --line:#2c1c47;
  --ink:#f5eeff; --muted:#a892d0;
  --pink:#ff4d9d; --gold:#ffd36b; --cyan:#59e0ff; --grn:#7CF6A0;
  --glow:0 0 24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}  /* beat display:flex/block rules below */
body{
  margin:0;font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  color:var(--ink);background:
    radial-gradient(900px 500px at 80% -10%, rgba(255,77,157,.18), transparent 60%),
    radial-gradient(800px 500px at 0% 110%, rgba(89,224,255,.14), transparent 55%),
    var(--bg);
  min-height:100dvh;padding-bottom:96px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header{padding:26px 0 12px;text-align:center}
.kicker{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(34px,10vw,52px);
  margin:.1em 0 0;line-height:.95;
  background:linear-gradient(100deg,var(--pink),var(--gold) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.me-tag{margin-top:10px;font-size:14px;color:var(--muted)}
.me-tag b{color:var(--ink)}
.me-tag a{color:var(--pink);text-decoration:none;margin-left:8px;font-size:13px}

/* identity picker */
.pick h2{font-family:"Bricolage Grotesque";font-weight:600;font-size:22px;text-align:center;margin:8px 0 18px}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);
  padding:16px 12px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;transition:.15s}
.pickbtn:active{transform:scale(.97);border-color:var(--pink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 30% 30%,#fff,var(--pink));box-shadow:var(--glow) var(--pink)}
.pickbtn.away{opacity:.55}
.pickbtn.away .dot{background:#4a3a68;box-shadow:none}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:linear-gradient(180deg,transparent,rgba(10,7,20,.92) 30%);
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabs{display:flex;gap:6px;background:rgba(27,16,48,.85);border:1px solid var(--line);
  border-radius:999px;padding:6px;backdrop-filter:blur(12px);width:100%;max-width:400px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;
  font-size:13px;padding:11px 0;border-radius:999px;cursor:pointer;transition:.15s}
.tab.on{color:#120a1f;background:linear-gradient(100deg,var(--pink),var(--gold))}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* people list */
.count{font-size:13px;color:var(--muted);margin:8px 2px 14px;text-align:center}
.person{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:15px 16px;margin-bottom:12px;transition:.15s}
.person.linked{border-color:rgba(124,246,160,.5);box-shadow:0 0 0 1px rgba(124,246,160,.15)}
.prow{display:flex;align-items:center;gap:12px}
.pname{font-size:18px;font-weight:600;flex:1}
.link-btn{border:0;border-radius:999px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:14px;
  cursor:pointer;transition:.15s;color:#120a1f;background:linear-gradient(100deg,var(--cyan),var(--gold))}
.link-btn:active{transform:scale(.94)}
.linked .link-btn{background:transparent;color:var(--grn);border:1px solid rgba(124,246,160,.4)}
.contacts{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#241338;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;
  color:var(--ink);text-decoration:none;display:inline-flex;gap:7px;align-items:center}
.chip .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.disc{margin-top:10px;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}
.disc:hover{color:var(--pink)}

/* graph */
#cy{width:100%;height:70vh;background:
  radial-gradient(600px 400px at 50% 40%,rgba(255,77,157,.08),transparent 70%);
  border:1px solid var(--line);border-radius:22px;margin-top:6px}

/* profile */
.me-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.me-card h3{font-family:"Bricolage Grotesque";margin:0 0 4px;font-size:20px}
.me-card p.hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.crow{display:flex;gap:8px;margin-bottom:10px}
.crow input{flex:1;background:#120a22;border:1px solid var(--line);border-radius:12px;color:var(--ink);
  padding:12px 13px;font-family:inherit;font-size:15px}
.crow input.lbl{flex:0 0 34%}
.crow input:focus{outline:none;border-color:var(--pink)}
.crow .x{background:#2a1540;border:1px solid var(--line);color:var(--muted);border-radius:12px;
  width:44px;cursor:pointer;font-size:18px}
.add{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:12px;
  width:100%;cursor:pointer;font-family:inherit;font-size:14px;margin-top:4px}
.save{width:100%;margin-top:16px;border:0;border-radius:14px;padding:15px;font-family:inherit;font-weight:800;
  font-size:16px;color:#120a1f;background:linear-gradient(100deg,var(--pink),var(--gold));cursor:pointer}
.save:active{transform:scale(.98)}
.saved{color:var(--grn);text-align:center;font-size:14px;margin-top:10px;height:18px}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* contact sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(6,4,12,.6);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet-card{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;
  width:100%;max-width:560px;margin:0 auto;padding:24px 20px calc(30px + env(safe-area-inset-bottom));
  position:relative;animation:slideup .25s cubic-bezier(.22,1,.36,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet-card h3{font-family:"Bricolage Grotesque";font-size:26px;margin:0 0 16px}
.sheet-x{position:absolute;top:16px;right:16px;background:#241338;border:1px solid var(--line);
  color:var(--muted);border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}
.sheet .contacts{display:flex;flex-wrap:wrap;gap:8px}

/* polls */
.poll{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.poll .q{font-family:"Bricolage Grotesque";font-weight:600;font-size:19px;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;
  overflow:hidden;background:#1a0f2e;transition:.15s;font-weight:600}
.opt .obar{position:absolute;inset:0;width:0;transition:width .6s cubic-bezier(.22,1,.36,1);z-index:0}
.opt.a .obar{background:linear-gradient(100deg,rgba(255,77,157,.35),rgba(255,133,184,.25))}
.opt.b .obar{background:linear-gradient(100deg,rgba(89,224,255,.32),rgba(124,246,160,.22))}
.opt .otxt{position:relative;z-index:1;display:flex;justify-content:space-between}
.opt.mine{border-color:var(--gold)}
.opt:active{transform:scale(.98)}
.pmeta{color:var(--muted);font-size:12px;margin-top:10px}

/* songs list */
.song{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 15px;margin-bottom:10px}
.song .sn{color:var(--muted);font-weight:700;min-width:1.3em;text-align:center}
.song .st{flex:1;min-width:0}
.song .st .stitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .st .sby{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* spotify search */
.trk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;margin-bottom:10px;cursor:pointer;transition:.15s}
.trk:active{transform:scale(.98);border-color:var(--grn)}
.trk img{width:48px;height:48px;border-radius:8px;flex:none;background:#241338;object-fit:cover}
.trk .ti{flex:1;min-width:0}
.trk .ti .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .ti .ta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .add{color:var(--grn);font-weight:700;font-size:22px;flex:none;padding:0 6px}
.trk.done{border-color:var(--grn);opacity:.7}
.trk.done .add{content:"✓"}
.mtoast{text-align:center;color:var(--grn);font-size:14px;height:18px;margin:2px 0 10px}
.playing{border-color:var(--grn)!important;background:linear-gradient(100deg,rgba(124,246,160,.1),var(--card))!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">you're invited</div>
    <h1>the&nbsp;party</h1>
    <div class="me-tag" id="metag" hidden></div>
  </header>

  <!-- identity picker -->
  <section class="pick" id="pick">
    <h2>who are you?</h2>
    <div class="pickgrid" id="pickgrid"></div>
  </section>

  <!-- app -->
  <main id="app" hidden>
    <section class="view on" id="v-people">
      <div class="count" id="count"></div>
      <div id="people"></div>
    </section>

    <section class="view" id="v-graph">
      <p class="count">tap anyone to see their contact info</p>
      <div id="cy"></div>
    </section>

    <section class="view" id="v-vote">
      <div id="pollbox"></div>
    </section>

    <section class="view" id="v-songs">
      <!-- spotify search (when connected) -->
      <div id="spotifyui" hidden>
        <div class="me-card" style="margin-bottom:14px">
          <h3>add a song 🎧</h3>
          <p class="hint">Search Spotify — your pick drops into the party queue.</p>
          <div class="crow"><input id="msearch" placeholder="song or artist…" autocomplete="off"></div>
        </div>
        <div id="mresults"></div>
        <h3 style="font-family:'Bricolage Grotesque';margin:22px 2px 12px">coming up</h3>
        <div id="mqueue"></div>
      </div>
      <!-- text fallback (when Spotify not connected) -->
      <div id="textui" hidden>
        <div class="me-card" style="margin-bottom:14px">
          <h3>request a song</h3>
          <div class="crow"><input id="songtitle" placeholder="song + artist"></div>
          <button class="save" id="songadd">add to queue</button>
        </div>
        <div id="songbox"></div>
      </div>
    </section>

    <section class="view" id="v-me">
      <div class="me-card">
        <h3>your contact info</h3>
        <p class="hint">Only people you connect with can see this. Add or remove anything.</p>
        <div id="crows"></div>
        <button class="add" id="addrow">+ add another</button>
        <button class="save" id="save">save</button>
        <div class="saved" id="savedmsg"></div>
      </div>
    </section>
  </main>
</div>

<!-- confirm dialog (host identity) -->
<div id="confirm" class="sheet" hidden>
  <div class="sheet-card" style="text-align:center">
    <h3 id="confirmtitle"></h3>
    <p class="hint" id="confirmmsg" style="margin-bottom:20px"></p>
    <button class="save" id="confirmyes"></button>
    <button class="disc" id="confirmno" style="display:block;margin:16px auto 0">cancel</button>
  </div>
</div>

<!-- contact sheet (tap a graph node) -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <button class="sheet-x" id="sheetx">×</button>
    <h3 id="sheetname"></h3>
    <div id="sheetcontacts"></div>
  </div>
</div>

<nav id="nav" hidden>
  <div class="tabs">
    <button class="tab on" data-v="people">people</button>
    <button class="tab" data-v="graph">graph</button>
    <button class="tab" data-v="vote">vote</button>
    <button class="tab" data-v="songs">songs</button>
    <button class="tab" data-v="me">you</button>
  </div>
</nav>

<script>
const $ = s => document.querySelector(s);
const HOST_NAME = "david";  // tapping this name -> admin (with confirm)
let me = +localStorage.getItem("me_id") || null;

function showConfirm(title, msg, yesLabel, onYes){
  $("#confirmtitle").textContent = title;
  $("#confirmmsg").textContent = msg;
  const y = $("#confirmyes"); y.textContent = yesLabel;
  y.onclick = onYes;
  $("#confirm").hidden = false;
}
let state = {guests:[], edges:[]};
let cy = null;

// ---- contact link heuristics ----
function chipHref(label, val){
  const l = label.toLowerCase(), v = val.trim();
  if(/phone|cell|number|text|tel/.test(l) || /^\+?[\d ()-]{7,}$/.test(v))
    return "tel:" + v.replace(/[^\d+]/g,"");
  if(/insta/.test(l)) return "https://instagram.com/" + v.replace(/^@/,"");
  if(/twitter|^x$/.test(l)) return "https://x.com/" + v.replace(/^@/,"");
  if(/^https?:\/\//.test(v)) return v;
  return null;
}

let current = "people";
async function load(){
  if(!me){ return renderPick(); }
  const r = await fetch("/state?me=" + me);
  state = await r.json();
  renderMeTag(); renderPeople(); renderGraph();
  if(current === "vote") renderVote();
  if(current === "songs") renderSongs();
}

// ---- identity ----
async function renderPick(){
  $("#pick").hidden = false; $("#app").hidden = true; $("#nav").hidden = true;
  $("#metag").hidden = true;
  const roster = await (await fetch("/roster")).json();
  const g = $("#pickgrid"); g.innerHTML = "";
  if(!roster.length){ g.innerHTML = '<p class="empty">No guests yet — hang tight!</p>'; return; }
  for(const p of roster){
    const b = document.createElement("button");
    b.className = "pickbtn" + (p.present ? "" : " away");
    b.innerHTML = '<span class="dot"></span>' + esc(p.name);
    b.onclick = () => {
      if(p.name.trim().toLowerCase() === HOST_NAME){
        showConfirm("Are you really "+p.name+"?",
          "This opens the party admin controls — for the host only.",
          "yes, I'm the host", () => { location.href = "/admin-entry"; });
        return;
      }
      fetch("/checkin/" + p.id, {method:"POST"})  // mark yourself here
        .then(() => { me = p.id; localStorage.setItem("me_id", me); load(); });
    };
    g.appendChild(b);
  }
}
function renderMeTag(){
  const mine = state.guests.find(x=>x.id===me);
  const t = $("#metag");
  t.hidden = false;
  t.innerHTML = "you're <b>" + esc(mine ? mine.name : "?") + "</b><a id='notme'>not you?</a>";
  $("#notme").onclick = () => { localStorage.removeItem("me_id"); me=null; load(); };
  $("#pick").hidden = true; $("#app").hidden = false; $("#nav").hidden = false;
}

// ---- people / connect ----
function connectedIds(){
  const s = new Set();
  for(const e of state.edges){
    if(e.a===me) s.add(e.b); else if(e.b===me) s.add(e.a);
  }
  return s;
}
function renderPeople(){
  const others = state.guests.filter(p=>p.id!==me);
  const linked = connectedIds();
  $("#count").textContent = others.length + " here • " + linked.size + " connected";
  const box = $("#people"); box.innerHTML = "";
  if(!others.length){ box.innerHTML = '<p class="empty">You\'re the first one here 🎉</p>'; return; }
  for(const p of others){
    const on = linked.has(p.id);
    const d = document.createElement("div");
    d.className = "person" + (on ? " linked" : "");
    let html = '<div class="prow"><div class="pname">'+esc(p.name)+'</div>' +
      '<button class="link-btn">'+(on?"✓ connected":"connect")+'</button></div>';
    if(on && p.contacts){
      html += '<div class="contacts">' + (p.contacts.length
        ? p.contacts.map(c=>chip(c)).join("")
        : '<span class="chip"><span class="k">no info shared</span></span>') + '</div>';
      html += '<button class="disc">disconnect</button>';
    }
    d.innerHTML = html;
    d.querySelector(".link-btn").onclick = () => on ? null : act("/connect", p.id);
    const dc = d.querySelector(".disc"); if(dc) dc.onclick = () => act("/disconnect", p.id);
    box.appendChild(d);
  }
}
function chip(c){
  const href = chipHref(c.label, c.value);
  const inner = '<span class="k">'+esc(c.label||"·")+'</span>'+esc(c.value);
  return href ? '<a class="chip" href="'+esc(href)+'" target="_blank" rel="noopener">'+inner+'</a>'
              : '<span class="chip">'+inner+'</span>';
}
// tap a graph node -> pull anyone's contacts
async function openSheet(id){
  const g = await (await fetch("/guest/"+id)).json();
  $("#sheetname").textContent = g.name;
  const cs = g.contacts || [];
  $("#sheetcontacts").innerHTML = cs.length
    ? '<div class="contacts">'+cs.map(c=>chip(c)).join("")+'</div>'
    : '<p class="empty" style="padding:8px 0">no contact info shared yet</p>';
  $("#sheet").hidden = false;
}
$("#confirmno").onclick = () => $("#confirm").hidden = true;
$("#confirm").onclick = (e) => { if(e.target.id==="confirm") $("#confirm").hidden = true; };
$("#sheetx").onclick = () => $("#sheet").hidden = true;
$("#sheet").onclick = (e) => { if(e.target.id==="sheet") $("#sheet").hidden = true; };

async function act(path, other){
  await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({a:me, b:other})});
  load();
}

// ---- graph ----
const LAYOUT = {name:"cose", animate:false, padding:30,
  idealEdgeLength: e => 240 - (e.data("weight")||50)*1.6};
function graphEls(){
  return state.guests.map(p=>({data:{id:"n"+p.id, label:p.name, me:p.id===me}}))
    .concat(state.edges.map(e=>({data:{
      id:"e"+e.a+"_"+e.b, source:"n"+e.a, target:"n"+e.b, weight:e.weight,
      mine:(e.a===me||e.b===me)}})));
}
function centerMe(){
  if(!cy) return;
  const m = cy.$('#n'+me);
  if(m.length){ cy.animate({center:{eles:m}, zoom:1.1}, {duration:400}); }
  else { cy.fit(null,30); }
}
function renderGraph(){
  const els = graphEls();
  if(!cy){
    cy = cytoscape({
      container:$("#cy"), elements:els, minZoom:.3, maxZoom:2.5,
      style:[
        {selector:"node",style:{
          "background-color":"#ff4d9d","label":"data(label)","color":"#f5eeff",
          "font-family":"Instrument Sans","font-size":13,"font-weight":600,
          "text-valign":"bottom","text-margin-y":6,"width":26,"height":26,
          "border-width":2,"border-color":"#1b1030","text-outline-color":"#0a0714","text-outline-width":3}},
        {selector:'node[?me]',style:{"background-color":"#ffd36b","width":44,"height":44,
          "border-color":"#ff4d9d","border-width":4,"font-size":16,"z-index":10}},
        // my own connections pop; everyone else's fade into the background
        {selector:"edge",style:{"width":"mapData(weight,0,100,1.5,5)","line-color":"#3a4a6a",
          "opacity":.28,"curve-style":"straight"}},
        {selector:'edge[?mine]',style:{"line-color":"#ffd36b","opacity":"mapData(weight,0,100,.5,1)",
          "width":"mapData(weight,0,100,2.5,7)","z-index":9}}
      ],
      layout:LAYOUT
    });
    cy.one("layoutstop", centerMe);
    cy.on("tap", "node", evt => openSheet(+evt.target.id().slice(1)));
  } else {
    cy.json({elements:els});
    cy.layout(LAYOUT).run().promiseOn("layoutstop").then(centerMe);
  }
}

// ---- profile ----
function crowEl(label="", value=""){
  const d = document.createElement("div"); d.className="crow";
  d.innerHTML = '<input class="lbl" placeholder="label" value="'+esc(label)+'">' +
                '<input class="val" placeholder="e.g. @handle / number" value="'+esc(value)+'">' +
                '<button class="x">×</button>';
  d.querySelector(".x").onclick = () => d.remove();
  return d;
}
function openProfile(){
  const mine = state.guests.find(x=>x.id===me);
  const rows = $("#crows"); rows.innerHTML = "";
  const cs = (mine && mine.contacts) || [];
  if(cs.length) cs.forEach(c=>rows.appendChild(crowEl(c.label, c.value)));
  else rows.appendChild(crowEl());
  $("#savedmsg").textContent = "";
}
$("#addrow").onclick = () => $("#crows").appendChild(crowEl());
$("#save").onclick = async () => {
  const contacts = [...$("#crows").querySelectorAll(".crow")].map(r=>({
    label:r.querySelector(".lbl").value, value:r.querySelector(".val").value}));
  await fetch("/profile/"+me, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({contacts})});
  $("#savedmsg").textContent = "saved ✓";
  load();
};

// ---- vote ----
async function renderVote(){
  const polls = await (await fetch("/polls?me="+me)).json();
  const box = $("#pollbox");
  if(!polls.length){ box.innerHTML = '<p class="empty">No polls yet — check back soon!</p>'; return; }
  box.innerHTML = "";
  for(const p of polls){
    const tot=p.a+p.b, pa=tot?Math.round(p.a/tot*100):0, pb=tot?100-pa:0;
    const d = document.createElement("div"); d.className="poll";
    d.innerHTML = '<p class="q">'+esc(p.question)+'</p><div class="opts">'+
      optHtml(p,"a",p.opt_a,pa)+optHtml(p,"b",p.opt_b,pb)+'</div>'+
      '<div class="pmeta">'+tot+' vote'+(tot===1?'':'s')+(p.mine?' · you voted (tap to change)':' · tap to vote')+'</div>';
    d.querySelectorAll(".opt").forEach(o=>o.onclick=()=>vote(p.id,o.dataset.c));
    box.appendChild(d);
    requestAnimationFrame(()=>d.querySelectorAll(".opt").forEach(o=>{
      o.querySelector(".obar").style.width = (p.mine ? (o.dataset.c==="a"?pa:pb) : 0)+"%"; }));
  }
}
function optHtml(p,k,label,pct){
  const mine = p.mine===k;
  return '<div class="opt '+k+(mine?' mine':'')+'" data-c="'+k+'"><div class="obar"></div>'+
    '<div class="otxt"><span>'+(mine?'✓ ':'')+esc(label)+'</span><span>'+(p.mine?pct+'%':'')+'</span></div></div>';
}
async function vote(pid,choice){
  await fetch("/polls/vote",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({poll_id:pid,choice,me})});
  renderVote();
}

// ---- songs ----
let spotifyOn = null;
async function renderSongs(){
  const st = await (await fetch("/music/status")).json();
  spotifyOn = st.connected;
  $("#spotifyui").hidden = !spotifyOn;
  $("#textui").hidden = spotifyOn;
  if(spotifyOn) refreshQueue(); else renderTextSongs();
}
async function refreshQueue(){
  const d = await (await fetch("/music/now")).json();
  const box = $("#mqueue");
  let html = "";
  if(d.playing) html += trkRow(d.playing, "▶ now playing", true);
  html += (d.queue||[]).map(t=>trkRow(t,"",false)).join("");
  box.innerHTML = html || '<p class="empty">Nothing queued yet — search above!</p>';
}
function trkRow(t, tag, now){
  return '<div class="song'+(now?' playing':'')+'">'+
    (t.art?'<img class="qart" src="'+esc(t.art)+'">':'')+
    '<div class="st"><div class="stitle">'+esc(t.title)+'</div>'+
    '<div class="sby">'+esc(t.artist)+(tag?' · '+tag:'')+'</div></div></div>';
}
// debounced search
let msTimer=null;
function setupSearch(){
  const inp=$("#msearch"); if(inp._wired) return; inp._wired=true;
  inp.oninput=()=>{ clearTimeout(msTimer); msTimer=setTimeout(doSearch,350); };
}
async function doSearch(){
  const q=$("#msearch").value.trim();
  const box=$("#mresults");
  if(!q){ box.innerHTML=""; return; }
  let res;
  try{ res=await (await fetch("/music/search?q="+encodeURIComponent(q))).json(); }
  catch(e){ return; }
  if(!Array.isArray(res)){ box.innerHTML=""; return; }
  box.innerHTML = res.length ? res.map((t,i)=>
    '<div class="trk" data-i="'+i+'">'+
    (t.art?'<img src="'+esc(t.art)+'">':'<img>')+
    '<div class="ti"><div class="tt">'+esc(t.title)+'</div><div class="ta">'+esc(t.artist)+'</div></div>'+
    '<span class="add">＋</span></div>').join("")
    : '<p class="empty">No matches.</p>';
  [...box.querySelectorAll(".trk")].forEach((el,i)=>el.onclick=()=>queueTrack(res[i],el));
}
async function queueTrack(t, el){
  const r = await fetch("/music/queue",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uri:t.uri})});
  if(r.ok){ el.classList.add("done"); el.querySelector(".add").textContent="✓"; toast("added ✓"); refreshQueue(); }
  else { const e=await r.json().catch(()=>({})); toast(e.detail||"couldn't add"); }
}
function toast(msg){ let t=$("#mtoast"); if(!t){ t=document.createElement("div"); t.id="mtoast";
    t.className="mtoast"; $("#mresults").before(t); } t.textContent=msg;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.textContent="",2500); }

// text fallback
async function renderTextSongs(){
  const songs = await (await fetch("/songs")).json();
  $("#songbox").innerHTML = songs.length ? songs.map((s,i)=>
    '<div class="song"><span class="sn">'+(i+1)+'</span><div class="st"><div class="stitle">'+esc(s.title)+'</div>'+
    (s.by?'<div class="sby">'+esc(s.by)+'</div>':'')+'</div></div>').join("")
    : '<p class="empty">Queue is empty — add the first song!</p>';
}
$("#songadd").onclick = async () => {
  const t = $("#songtitle").value.trim(); if(!t) return;
  const mine = state.guests.find(x=>x.id===me);
  await fetch("/songs",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({title:t, by: mine?mine.name:""})});
  $("#songtitle").value=""; renderTextSongs();
};
setupSearch();

// ---- tabs ----
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  current = t.dataset.v;
  $("#v-"+current).classList.add("on");
  if(current==="me") openProfile();
  if(current==="vote") renderVote();
  if(current==="songs") renderSongs();
  if(current==="graph" && cy) setTimeout(()=>{cy.resize();cy.fit(null,30)},50);
});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

load();
setInterval(load, 2500);
</script>
</body>
</html>
