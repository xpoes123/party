<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/static/qrcode.js"></script>
<link rel="stylesheet" href="/static/css/tokyo-night.css">
<style>
:root{
  --bg2:#16161e; --card:#1f2335; --card2:#24283b; --line:#2a2f45;
  --ink:var(--text); --ink2:#a9b1d6; --faint:#414868;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:6px; --r-sm:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);
  min-height:100dvh;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 60px}
header{padding:30px 0 18px;text-align:center}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,8vw,42px);margin:.16em 0 0;
  letter-spacing:-.02em;line-height:1;
  background:linear-gradient(100deg,var(--blue),var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}

.search{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink);padding:15px 16px;font-family:var(--body);font-size:16px}
.search input:focus{outline:none;border-color:var(--blue)}
.search input::placeholder{color:var(--faint)}

.sec-label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:20px 2px 12px}
.mtoast{font-family:var(--mono);text-align:center;color:var(--green);font-size:12px;height:16px;margin:4px 0}

.trk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 11px;margin-bottom:8px;cursor:pointer;transition:.12s}
.trk:hover{border-color:var(--blue)}
.trk:active{transform:scale(.99)}
.trk img{width:48px;height:48px;border-radius:var(--r-sm);flex:none;background:var(--card2);object-fit:cover}
.trk .ti{flex:1;min-width:0}
.trk .ti .tt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .ti .ta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .add{color:var(--blue);font-size:24px;flex:none;padding:0 8px}
.trk.done{border-color:rgba(158,206,106,.5)}
.trk.done .add{color:var(--green)}

.song{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.song img{width:44px;height:44px;border-radius:var(--r-sm);flex:none;object-fit:cover;background:var(--card2)}
.song .st{flex:1;min-width:0}
.song .st .stitle{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .st .sby{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song.playing{border-color:rgba(158,206,106,.4)}
.song .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);flex:none}
.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:14px}
.qrtop{text-align:center;margin:4px 0 22px}
.qrwrap{display:inline-block;background:#fff;padding:8px;border-radius:var(--r);border:1px solid var(--line)}
.qrwrap img{display:block;width:100px;height:100px;image-rendering:pixelated}
.foourl{font-family:var(--mono);color:var(--muted);font-size:11px;letter-spacing:.06em;margin-top:9px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">the party</div>
    <h1>request a song</h1>
    <div class="sub">search · tap to add · it plays</div>
  </header>

  <div class="qrtop">
    <div class="qrwrap" id="qrbox"></div>
    <div class="foourl">party.djiang.xyz · scan or share to add songs</div>
  </div>

  <div id="offline" class="empty" hidden>Song requests aren't open yet — hang tight.</div>

  <div id="app" hidden>
    <div class="search"><input id="q" placeholder="search a song or artist" autocomplete="off"></div>
    <div class="mtoast" id="toast"></div>
    <div id="results"></div>
    <div class="sec-label">up next</div>
    <div id="queue"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

// ---- search ----
let tmr=null;
$("#q").addEventListener("input", ()=>{ clearTimeout(tmr); tmr=setTimeout(doSearch,350); });
async function doSearch(){
  const q=$("#q").value.trim(), box=$("#results");
  if(!q){ box.innerHTML=""; return; }
  let res;
  try{ res=await (await fetch("/music/search?q="+encodeURIComponent(q))).json(); }catch(e){ return; }
  if(!Array.isArray(res)){ box.innerHTML=""; return; }
  box.innerHTML = res.length ? res.map((t,i)=>
    '<div class="trk" data-i="'+i+'">'+
    (t.art?'<img src="'+esc(t.art)+'">':'<img>')+
    '<div class="ti"><div class="tt">'+esc(t.title)+'</div><div class="ta">'+esc(t.artist)+'</div></div>'+
    '<span class="add">+</span></div>').join("")
    : '<p class="empty">No matches.</p>';
  [...box.querySelectorAll(".trk")].forEach((el,i)=>el.onclick=()=>add(res[i],el));
}
async function add(t, el){
  const r=await fetch("/music/queue",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({uri:t.uri})});
  if(r.ok){ el.classList.add("done"); el.querySelector(".add").textContent="✓"; toast("added to the queue"); loadQueue(); }
  else{ const e=await r.json().catch(()=>({})); toast(e.detail||"couldn't add — ask the host to start Spotify"); }
}
function toast(m){ const t=$("#toast"); t.textContent=m; clearTimeout(toast._t); toast._t=setTimeout(()=>t.textContent="",2800); }

// ---- queue ----
async function loadQueue(){
  const st=await (await fetch("/music/status")).json();
  const on = st.connected;
  $("#offline").hidden = on; $("#app").hidden = !on;
  if(!on) return;
  const d=await (await fetch("/music/now")).json();
  const box=$("#queue");
  let html="";
  if(d.playing) html+=row(d.playing, true);
  html+=(d.queue||[]).map(t=>row(t,false)).join("");
  box.innerHTML = html || '<p class="empty">Nothing queued yet — add the first one.</p>';
}
function row(t, now){
  return '<div class="song'+(now?' playing':'')+'">'+
    (t.art?'<img src="'+esc(t.art)+'">':'')+
    '<div class="st"><div class="stitle">'+esc(t.title)+'</div><div class="sby">'+esc(t.artist)+'</div></div>'+
    (now?'<span class="tag">now playing</span>':'')+'</div>';
}
// QR of this page so people can share it phone-to-phone
try{ const qr=qrcode(0,"M"); qr.addData(location.origin+"/"); qr.make();
  document.getElementById("qrbox").innerHTML=qr.createImgTag(4,0); }catch(e){}

loadQueue();
setInterval(loadQueue, 4000);
</script>
</body>
</html>
