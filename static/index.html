<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>the party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="/static/cytoscape.min.js"></script>
<style>
:root{
  --bg:#0a0714; --bg2:#150b28; --card:#1b1030; --line:#2c1c47;
  --ink:#f5eeff; --muted:#a892d0;
  --pink:#ff4d9d; --gold:#ffd36b; --cyan:#59e0ff; --grn:#7CF6A0;
  --glow:0 0 24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  color:var(--ink);background:
    radial-gradient(900px 500px at 80% -10%, rgba(255,77,157,.18), transparent 60%),
    radial-gradient(800px 500px at 0% 110%, rgba(89,224,255,.14), transparent 55%),
    var(--bg);
  min-height:100dvh;padding-bottom:96px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header{padding:26px 0 12px;text-align:center}
.kicker{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(34px,10vw,52px);
  margin:.1em 0 0;line-height:.95;
  background:linear-gradient(100deg,var(--pink),var(--gold) 55%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.me-tag{margin-top:10px;font-size:14px;color:var(--muted)}
.me-tag b{color:var(--ink)}
.me-tag a{color:var(--pink);text-decoration:none;margin-left:8px;font-size:13px}

/* identity picker */
.pick h2{font-family:"Bricolage Grotesque";font-weight:600;font-size:22px;text-align:center;margin:8px 0 18px}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pickbtn{background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);
  padding:16px 12px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;transition:.15s}
.pickbtn:active{transform:scale(.97);border-color:var(--pink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 30% 30%,#fff,var(--pink));box-shadow:var(--glow) var(--pink)}
.pickbtn.away{opacity:.55}
.pickbtn.away .dot{background:#4a3a68;box-shadow:none}

/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:linear-gradient(180deg,transparent,rgba(10,7,20,.92) 30%);
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabs{display:flex;gap:6px;background:rgba(27,16,48,.85);border:1px solid var(--line);
  border-radius:999px;padding:6px;backdrop-filter:blur(12px);width:100%;max-width:400px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:600;
  font-size:14px;padding:11px 0;border-radius:999px;cursor:pointer;transition:.15s}
.tab.on{color:#120a1f;background:linear-gradient(100deg,var(--pink),var(--gold))}

.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* people list */
.count{font-size:13px;color:var(--muted);margin:8px 2px 14px;text-align:center}
.person{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:15px 16px;margin-bottom:12px;transition:.15s}
.person.linked{border-color:rgba(124,246,160,.5);box-shadow:0 0 0 1px rgba(124,246,160,.15)}
.prow{display:flex;align-items:center;gap:12px}
.pname{font-size:18px;font-weight:600;flex:1}
.link-btn{border:0;border-radius:999px;padding:9px 16px;font-family:inherit;font-weight:700;font-size:14px;
  cursor:pointer;transition:.15s;color:#120a1f;background:linear-gradient(100deg,var(--cyan),var(--gold))}
.link-btn:active{transform:scale(.94)}
.linked .link-btn{background:transparent;color:var(--grn);border:1px solid rgba(124,246,160,.4)}
.contacts{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#241338;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;
  color:var(--ink);text-decoration:none;display:inline-flex;gap:7px;align-items:center}
.chip .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.disc{margin-top:10px;font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;padding:0}
.disc:hover{color:var(--pink)}

/* graph */
#cy{width:100%;height:70vh;background:
  radial-gradient(600px 400px at 50% 40%,rgba(255,77,157,.08),transparent 70%);
  border:1px solid var(--line);border-radius:22px;margin-top:6px}

/* profile */
.me-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.me-card h3{font-family:"Bricolage Grotesque";margin:0 0 4px;font-size:20px}
.me-card p.hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.crow{display:flex;gap:8px;margin-bottom:10px}
.crow input{flex:1;background:#120a22;border:1px solid var(--line);border-radius:12px;color:var(--ink);
  padding:12px 13px;font-family:inherit;font-size:15px}
.crow input.lbl{flex:0 0 34%}
.crow input:focus{outline:none;border-color:var(--pink)}
.crow .x{background:#2a1540;border:1px solid var(--line);color:var(--muted);border-radius:12px;
  width:44px;cursor:pointer;font-size:18px}
.add{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:12px;
  width:100%;cursor:pointer;font-family:inherit;font-size:14px;margin-top:4px}
.save{width:100%;margin-top:16px;border:0;border-radius:14px;padding:15px;font-family:inherit;font-weight:800;
  font-size:16px;color:#120a1f;background:linear-gradient(100deg,var(--pink),var(--gold));cursor:pointer}
.save:active{transform:scale(.98)}
.saved{color:var(--grn);text-align:center;font-size:14px;margin-top:10px;height:18px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">you're invited</div>
    <h1>the&nbsp;party</h1>
    <div class="me-tag" id="metag" hidden></div>
  </header>

  <!-- identity picker -->
  <section class="pick" id="pick">
    <h2>who are you?</h2>
    <div class="pickgrid" id="pickgrid"></div>
  </section>

  <!-- app -->
  <main id="app" hidden>
    <section class="view on" id="v-people">
      <div class="count" id="count"></div>
      <div id="people"></div>
    </section>

    <section class="view" id="v-graph">
      <div id="cy"></div>
    </section>

    <section class="view" id="v-me">
      <div class="me-card">
        <h3>your contact info</h3>
        <p class="hint">Only people you connect with can see this. Add or remove anything.</p>
        <div id="crows"></div>
        <button class="add" id="addrow">+ add another</button>
        <button class="save" id="save">save</button>
        <div class="saved" id="savedmsg"></div>
      </div>
    </section>
  </main>
</div>

<nav id="nav" hidden>
  <div class="tabs">
    <button class="tab on" data-v="people">people</button>
    <button class="tab" data-v="graph">graph</button>
    <button class="tab" data-v="me">you</button>
  </div>
</nav>

<script>
const $ = s => document.querySelector(s);
let me = +localStorage.getItem("me_id") || null;
let state = {guests:[], edges:[]};
let cy = null;

// ---- contact link heuristics ----
function chipHref(label, val){
  const l = label.toLowerCase(), v = val.trim();
  if(/phone|cell|number|text|tel/.test(l) || /^\+?[\d ()-]{7,}$/.test(v))
    return "tel:" + v.replace(/[^\d+]/g,"");
  if(/insta/.test(l)) return "https://instagram.com/" + v.replace(/^@/,"");
  if(/twitter|^x$/.test(l)) return "https://x.com/" + v.replace(/^@/,"");
  if(/^https?:\/\//.test(v)) return v;
  return null;
}

async function load(){
  if(!me){ return renderPick(); }
  const r = await fetch("/state?me=" + me);
  state = await r.json();
  renderMeTag(); renderPeople(); renderGraph();
}

// ---- identity ----
async function renderPick(){
  $("#pick").hidden = false; $("#app").hidden = true; $("#nav").hidden = true;
  $("#metag").hidden = true;
  const roster = await (await fetch("/roster")).json();
  const g = $("#pickgrid"); g.innerHTML = "";
  if(!roster.length){ g.innerHTML = '<p class="empty">No guests yet — hang tight!</p>'; return; }
  for(const p of roster){
    const b = document.createElement("button");
    b.className = "pickbtn" + (p.present ? "" : " away");
    b.innerHTML = '<span class="dot"></span>' + esc(p.name);
    b.onclick = async () => {
      await fetch("/checkin/" + p.id, {method:"POST"});  // mark yourself here
      me = p.id; localStorage.setItem("me_id", me); load();
    };
    g.appendChild(b);
  }
}
function renderMeTag(){
  const mine = state.guests.find(x=>x.id===me);
  const t = $("#metag");
  t.hidden = false;
  t.innerHTML = "you're <b>" + esc(mine ? mine.name : "?") + "</b><a id='notme'>not you?</a>";
  $("#notme").onclick = () => { localStorage.removeItem("me_id"); me=null; load(); };
  $("#pick").hidden = true; $("#app").hidden = false; $("#nav").hidden = false;
}

// ---- people / connect ----
function connectedIds(){
  const s = new Set();
  for(const e of state.edges){
    if(e.a===me) s.add(e.b); else if(e.b===me) s.add(e.a);
  }
  return s;
}
function renderPeople(){
  const others = state.guests.filter(p=>p.id!==me);
  const linked = connectedIds();
  $("#count").textContent = others.length + " here • " + linked.size + " connected";
  const box = $("#people"); box.innerHTML = "";
  if(!others.length){ box.innerHTML = '<p class="empty">You\'re the first one here 🎉</p>'; return; }
  for(const p of others){
    const on = linked.has(p.id);
    const d = document.createElement("div");
    d.className = "person" + (on ? " linked" : "");
    let html = '<div class="prow"><div class="pname">'+esc(p.name)+'</div>' +
      '<button class="link-btn">'+(on?"✓ connected":"connect")+'</button></div>';
    if(on && p.contacts){
      html += '<div class="contacts">' + (p.contacts.length
        ? p.contacts.map(c=>chip(c)).join("")
        : '<span class="chip"><span class="k">no info shared</span></span>') + '</div>';
      html += '<button class="disc">disconnect</button>';
    }
    d.innerHTML = html;
    d.querySelector(".link-btn").onclick = () => on ? null : act("/connect", p.id);
    const dc = d.querySelector(".disc"); if(dc) dc.onclick = () => act("/disconnect", p.id);
    box.appendChild(d);
  }
}
function chip(c){
  const href = chipHref(c.label, c.value);
  const inner = '<span class="k">'+esc(c.label||"·")+'</span>'+esc(c.value);
  return href ? '<a class="chip" href="'+esc(href)+'" target="_blank" rel="noopener">'+inner+'</a>'
              : '<span class="chip">'+inner+'</span>';
}
async function act(path, other){
  await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({a:me, b:other})});
  load();
}

// ---- graph ----
function renderGraph(){
  const els = state.guests.map(p=>({data:{id:"n"+p.id, label:p.name, me:p.id===me}}))
    .concat(state.edges.map(e=>({data:{id:"e"+e.a+"_"+e.b, source:"n"+e.a, target:"n"+e.b}})));
  if(!cy){
    cy = cytoscape({
      container:$("#cy"), elements:els, minZoom:.3, maxZoom:2.5,
      style:[
        {selector:"node",style:{
          "background-color":"#ff4d9d","label":"data(label)","color":"#f5eeff",
          "font-family":"Instrument Sans","font-size":13,"font-weight":600,
          "text-valign":"bottom","text-margin-y":6,"width":26,"height":26,
          "border-width":2,"border-color":"#1b1030","text-outline-color":"#0a0714","text-outline-width":3}},
        {selector:'node[?me]',style:{"background-color":"#ffd36b","width":40,"height":40,
          "border-color":"#ff4d9d","border-width":3}},
        {selector:"edge",style:{"width":2.5,"line-color":"#59e0ff","opacity":.55,"curve-style":"straight"}}
      ],
      layout:{name:"cose", animate:false, padding:30}
    });
  } else {
    cy.json({elements:els});
    cy.layout({name:"cose", animate:false, padding:30}).run();
  }
}

// ---- profile ----
function crowEl(label="", value=""){
  const d = document.createElement("div"); d.className="crow";
  d.innerHTML = '<input class="lbl" placeholder="label" value="'+esc(label)+'">' +
                '<input class="val" placeholder="e.g. @handle / number" value="'+esc(value)+'">' +
                '<button class="x">×</button>';
  d.querySelector(".x").onclick = () => d.remove();
  return d;
}
function openProfile(){
  const mine = state.guests.find(x=>x.id===me);
  const rows = $("#crows"); rows.innerHTML = "";
  const cs = (mine && mine.contacts) || [];
  if(cs.length) cs.forEach(c=>rows.appendChild(crowEl(c.label, c.value)));
  else rows.appendChild(crowEl());
  $("#savedmsg").textContent = "";
}
$("#addrow").onclick = () => $("#crows").appendChild(crowEl());
$("#save").onclick = async () => {
  const contacts = [...$("#crows").querySelectorAll(".crow")].map(r=>({
    label:r.querySelector(".lbl").value, value:r.querySelector(".val").value}));
  await fetch("/profile/"+me, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({contacts})});
  $("#savedmsg").textContent = "saved ✓";
  load();
};

// ---- tabs ----
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");
  $("#v-"+t.dataset.v).classList.add("on");
  if(t.dataset.v==="me") openProfile();
  if(t.dataset.v==="graph" && cy) setTimeout(()=>{cy.resize();cy.fit(null,30)},50);
});

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

load();
setInterval(load, 2500);
</script>
</body>
</html>
