<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the party — admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1b26;--card:#1f2335;--card2:#24283b;--line:#2a2f45;
  --ink:#c0caf5;--ink2:#a9b1d6;--muted:#565f89;--faint:#414868;
  --blue:#7aa2f7;--purple:#bb9af7;--green:#9ece6a;--red:#f7768e;
  --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  --r:8px;--r-sm:4px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);padding:24px 16px 60px;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto}
h1{font-family:var(--display);font-weight:600;font-size:30px;margin:0 0 4px;letter-spacing:-.02em;
  background:linear-gradient(100deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 24px;font-size:13px;font-family:var(--mono)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
h2{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.cc{color:var(--muted);font-size:13px;line-height:1.5}
.big{border:0;border-radius:var(--r-sm);padding:13px;width:100%;font-weight:600;font-family:var(--display);
  font-size:15px;color:var(--bg);background:var(--blue);cursor:pointer;text-decoration:none;display:block;text-align:center}
.ctrls{display:flex;gap:10px;margin-top:14px}
.ctrl{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:var(--r-sm);
  padding:13px 0;font-family:var(--body);font-weight:600;font-size:15px;cursor:pointer}
.ctrl:active{transform:scale(.98);border-color:var(--blue)}
.prow2{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow2:last-child{border-bottom:0}
.prow2 .pi{flex:1;min-width:0}
.prow2 .pqx{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .pcx{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:var(--r-sm);
  padding:7px 11px;cursor:pointer;font-family:var(--mono);font-size:13px}
.mini:hover{color:var(--ink)}
.mini:disabled{opacity:.3;cursor:default}
.mini.del:hover{color:var(--red);border-color:var(--red)}
#nowplaying .prow2{border:0}
#upnext{margin-top:12px}
.links{color:var(--muted);font-size:12px;margin-top:20px;font-family:var(--mono)}
.links a{color:var(--blue)}
.g{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.g:last-child{border-bottom:0}
.g .nm{font-weight:500;font-size:15px}
.toggle{position:relative;width:46px;height:26px;flex:none;border:0;border-radius:999px;cursor:pointer;background:var(--card2);transition:.15s}
.toggle.on{background:var(--green)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#c0caf5;transition:.15s}
.toggle.on::after{transform:translateX(20px);background:#1a1b26}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink);padding:11px;font-family:var(--body);font-size:14px}
.addrow input:focus{outline:none;border-color:var(--blue)}
.addrow input::placeholder{color:var(--faint)}
.addrow button{border:1px solid var(--blue);background:var(--blue);color:var(--bg);border-radius:var(--r-sm);padding:0 16px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>party admin</h1>
  <p class="sub">you control who's here + the music</p>

  <div class="card">
    <h2>who's here</h2>
    <p class="cc" id="hcount" style="margin:-6px 0 12px">…</p>
    <div id="guestlist"><p class="cc">loading…</p></div>
    <div class="addrow"><input id="newname" placeholder="add a walk-in" maxlength="40"><button id="addbtn">add</button></div>
  </div>

  <div class="card">
    <h2>music</h2>
    <div id="spotstatus" class="cc">checking…</div>
    <a class="big" id="spotconnect" style="margin-top:12px" hidden>connect Spotify</a>
    <div id="nowbox" hidden>
      <div id="nowplaying"></div>
      <div class="ctrls">
        <button class="ctrl" data-act="play">play</button>
        <button class="ctrl" data-act="pause">pause</button>
        <button class="ctrl" data-act="next">skip</button>
      </div>
      <div id="upnext"></div>
      <div id="qedit" class="ctrls" hidden>
        <button class="ctrl" id="qapply">apply order</button>
        <button class="ctrl" id="qcancel">cancel</button>
      </div>
      <p class="cc" style="margin-top:10px">Reorder (↑↓) or remove (×) upcoming songs, then apply — rebuilds the queue (brief blip, resumes the current song).</p>
    </div>
  </div>

  <p class="links">Guest queue: <a href="/" target="_blank">/</a> &nbsp;·&nbsp;
    Wall: <a href="/wall" target="_blank">/wall</a> &nbsp;·&nbsp;
    Welcome/QR: <a href="/welcome" target="_blank">/welcome</a></p>
</div>

<script>
// bootstrap admin key from ?key= once, stash in sessionStorage, scrub the URL
const urlKey = new URLSearchParams(location.search).get("key");
if(urlKey){ sessionStorage.setItem("admin_key", urlKey); history.replaceState(null,"",location.pathname); }
const key = sessionStorage.getItem("admin_key") || "";
const $ = s => document.querySelector(s);
const H = {"Content-Type":"application/json","X-Admin-Key":key};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function loadSpotify(){
  const st = await (await fetch("/music/status")).json();
  const s = $("#spotstatus"), btn = $("#spotconnect");
  if(!st.configured){
    s.textContent = "Not configured — add SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET to the server .env.";
    btn.hidden = true; $("#nowbox").hidden = true;
  } else if(st.connected){
    const base = st.base ? " · autopilot: "+st.base+" base songs"+(st.primed?" (active)":"") : "";
    s.textContent = "Connected. Keep Spotify playing on a device." + base;
    btn.hidden = false; btn.textContent = "reconnect Spotify"; btn.href = "/spotify/login?key="+encodeURIComponent(key);
    $("#nowbox").hidden = false; loadNow();
  } else {
    s.textContent = "Configured but not connected — link your Spotify:";
    btn.hidden = false; btn.textContent = "connect Spotify"; btn.href = "/spotify/login?key="+encodeURIComponent(key);
    $("#nowbox").hidden = true;
  }
}

let Q = [], qediting = false;
async function loadNow(){
  const d = await (await fetch("/music/now")).json();
  $("#nowplaying").innerHTML = d.playing
    ? '<div class="prow2"><div class="pi"><div class="pqx">▶ '+esc(d.playing.title)+'</div>'+
      '<div class="pcx">'+esc(d.playing.artist)+'</div></div></div>'
    : '<p class="cc">Nothing playing — start a song in Spotify on any device.</p>';
  if(!qediting){ Q = (d.queue||[]).slice(); renderQ(); }
}
function renderQ(){
  const box = $("#upnext");
  if(!Q.length){ box.innerHTML = ""; $("#qedit").hidden = true; return; }
  box.innerHTML = '<div class="cc" style="margin-bottom:6px">up next</div>' + Q.map((t,i)=>
    '<div class="prow2"><div class="pi"><div class="pqx">'+esc(t.title)+'</div>'+
    '<div class="pcx">'+esc(t.artist)+'</div></div>'+
    '<button class="mini" data-mv="up" data-i="'+i+'"'+(i===0?' disabled':'')+'>↑</button>'+
    '<button class="mini" data-mv="down" data-i="'+i+'"'+(i===Q.length-1?' disabled':'')+'>↓</button>'+
    '<button class="mini del" data-mv="del" data-i="'+i+'">×</button></div>').join("");
  box.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, mv=b.dataset.mv;
    if(mv==="up" && i>0){ [Q[i-1],Q[i]]=[Q[i],Q[i-1]]; }
    else if(mv==="down" && i<Q.length-1){ [Q[i+1],Q[i]]=[Q[i],Q[i+1]]; }
    else if(mv==="del"){ Q.splice(i,1); }
    qediting = true; renderQ();
  });
  $("#qedit").hidden = !qediting;
}
$("#qapply").onclick = async () => {
  const r = await fetch("/music/reorder",{method:"POST",headers:H,body:JSON.stringify({uris:Q.map(t=>t.uri)})});
  if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.detail||"reorder failed"); return; }
  qediting = false; setTimeout(loadNow, 700);
};
$("#qcancel").onclick = () => { qediting = false; loadNow(); };
document.querySelectorAll(".ctrl[data-act]").forEach(b=>b.onclick=async()=>{
  const r = await fetch("/music/control",{method:"POST",headers:H,body:JSON.stringify({action:b.dataset.act})});
  if(!r.ok){ const e=await r.json().catch(()=>({})); alert(e.detail||"control failed"); }
  setTimeout(loadNow, 400);
});

// ---- who's here (host-only check-in) ----
async function loadGuests(){
  const r = await fetch("/admin/guests", {headers:{"X-Admin-Key":key}});
  if(!r.ok){ $("#guestlist").innerHTML = '<p class="cc">bad admin key — check the URL.</p>'; return; }
  const gs = await r.json();
  const here = gs.filter(g=>g.present).length;
  $("#hcount").textContent = here+" of "+gs.length+" marked here — only they appear in the wall games.";
  const box = $("#guestlist");
  box.innerHTML = gs.length ? "" : '<p class="cc">no one yet — add walk-ins below.</p>';
  for(const g of gs){
    const row = document.createElement("div"); row.className="g";
    row.innerHTML = '<div class="nm">'+esc(g.name)+'</div><div style="flex:1"></div>'+
      '<button class="toggle'+(g.present?' on':'')+'"></button>';
    row.querySelector(".toggle").onclick = async () => {
      await fetch("/admin/present/"+g.id,{method:"POST",headers:H,body:JSON.stringify({present:!g.present})});
      loadGuests();
    };
    box.appendChild(row);
  }
}
$("#addbtn").onclick = async () => {
  const n = $("#newname").value.trim(); if(!n) return;
  await fetch("/admin/guest",{method:"POST",headers:H,body:JSON.stringify({name:n,contacts:[]})});
  $("#newname").value=""; loadGuests();
};
$("#newname").addEventListener("keydown", e => { if(e.key==="Enter") $("#addbtn").click(); });
loadGuests(); setInterval(loadGuests, 5000);

loadSpotify();
setInterval(loadSpotify, 5000);
</script>
</body>
</html>
