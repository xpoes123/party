<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>arena</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:transparent}
#c{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;top:28px;left:0;right:0;text-align:center;pointer-events:none}
.hud .t{font-family:"Space Grotesk";font-weight:600;font-size:clamp(24px,3vw,44px);letter-spacing:-.01em;color:#c0caf5}
.hud .s{font-family:"JetBrains Mono";font-size:clamp(12px,1.2vw,16px);color:#565f89;letter-spacing:.22em;text-transform:uppercase;margin-top:8px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="t" id="title">the arena</div><div class="s" id="sub">games of pure luck</div></div>
<script>
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
let W,H; function fit(){W=cv.width=innerWidth;H=cv.height=innerHeight;} fit(); addEventListener("resize",fit);
const PAL=["#7aa2f7","#bb9af7","#9ece6a","#e0af68","#7dcfff","#f7768e","#73daca","#ff9e64"];
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let NAMES=["Blue","Red","Green","Gold","Cyan","Pink","Teal","Orange","Max","Ryan","Coby","Sidd"];
async function loadNames(){
  try{ const s=await (await fetch("/roster")).json();
    const ns=s.map(g=>g.name).filter(Boolean);
    if(ns.length>=2) NAMES=ns;
  }catch(e){}
}
function players(n){
  const chosen=shuffle(NAMES).slice(0,Math.min(n,NAMES.length));
  return chosen.map((name,i)=>({name,color:PAL[i%PAL.length],alive:true,ph:Math.random()*6}));
}
function drawBlob(b,x,y,r){
  ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=22;
  ctx.beginPath();
  for(let a=0;a<=Math.PI*2+0.1;a+=0.4){const rr=r*(1+0.05*Math.sin(a*3+b.ph));
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr; a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
  ctx.closePath();ctx.fillStyle=b.color;ctx.globalAlpha=b.alive===false?0.15:0.92;ctx.fill();
  ctx.restore();
  ctx.fillStyle=b.alive===false?"#414868":"#c0caf5";ctx.font='500 15px Space Grotesk';
  ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(b.name,x,y+r+8);
}
function shortName(n){return n.length>7?n[0].toUpperCase():n;}
let particles=[];
function burst(x,y,color){for(let i=0;i<18;i++)particles.push({x,y,vx:rnd(-5,5),vy:rnd(-5,5),life:1,color});}
function drawParticles(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];
  p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.03;if(p.life<=0){particles.splice(i,1);continue;}
  ctx.globalAlpha=p.life;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fillStyle=p.color;ctx.fill();ctx.globalAlpha=1;}}

// ---------- games (each: init(), step(dt,t)->done, draw()) ----------
function Race(){return{title:"RACE",sub:"first blob across wins",
  init(){this.ps=players(Math.round(rnd(4,7)));const n=this.ps.length;
    this.finish=W-120;this.ps.forEach((p,i)=>{p.x=120;p.y=H*0.28+(H*0.5)*(i/(n-1||1));p.r=Math.min(34,(H*0.5/n)*0.42);});},
  step(){for(const p of this.ps){p.x+=rnd(0.6,5.2);if(p.x>=this.finish&&!this.winner){this.winner=p;burst(p.x,p.y,p.color);}}return!!this.winner;},
  draw(){ctx.strokeStyle="#2a2f45";ctx.setLineDash([8,10]);ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(this.finish,H*0.18);ctx.lineTo(this.finish,H*0.82);ctx.stroke();ctx.setLineDash([]);
    for(const p of this.ps)drawBlob(p,p.x,p.y,p.r);}};}

function Royale(){return{title:"LAST BLOB STANDING",sub:"random elimination",
  init(){this.ps=players(Math.round(rnd(5,8)));this.last=0;
    this.ps.forEach(p=>{p.x=rnd(120,W-120);p.y=rnd(140,H-120);p.vx=rnd(-3,3);p.vy=rnd(-3,3);p.r=30;});},
  step(dt,t){for(const p of this.ps){if(p.alive===false)continue;p.x+=p.vx;p.y+=p.vy;p.ph+=0.06;
      if(p.x<p.r||p.x>W-p.r)p.vx*=-1;if(p.y<120+p.r||p.y>H-p.r)p.vy*=-1;}
    const alive=this.ps.filter(p=>p.alive!==false);
    if(alive.length<=1){this.winner=alive[0];return true;}
    if(t-this.last>1000){this.last=t;const v=pick(alive);v.alive=false;burst(v.x,v.y,v.color);}
    return false;},
  draw(){for(const p of this.ps)drawBlob(p,p.x,p.y,p.r);}};}

function Coin(){return{title:"COIN FLIP",sub:"heads or tails",
  init(){this.ps=players(2);this.t0=null;this.dur=2400;this.done2=false;
    this.ps[0].x=W*0.28;this.ps[1].x=W*0.72;this.ps.forEach(p=>{p.y=H*0.62;p.r=44;});},
  step(dt,t){if(this.t0==null)this.t0=t;const e=t-this.t0;
    if(e>this.dur&&!this.winner){const w=Math.random()<0.5?0:1;this.side=w?"TAILS":"HEADS";
      this.winner=this.ps[w];burst(this.winner.x,H*0.32,this.winner.color);}
    return e>this.dur+1400;},
  draw(){for(const p of this.ps)drawBlob(p,p.x,p.y,p.r);
    const cx=W/2,cy=H*0.34,t=(performance.now()/120);const sc=this.winner?1:Math.abs(Math.cos(t));
    ctx.save();ctx.translate(cx,cy);ctx.scale(1,Math.max(0.08,sc));
    ctx.beginPath();ctx.arc(0,0,52,0,7);ctx.fillStyle="#e0af68";ctx.shadowColor="#e0af68";ctx.shadowBlur=24;ctx.fill();ctx.restore();
    if(this.winner){ctx.fillStyle="#16161e";ctx.font='700 26px Space Grotesk';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(this.side,cx,cy);}}};}

function Dice(){return{title:"HIGH ROLL",sub:"highest die wins",
  init(){this.ps=players(2);this.t0=null;this.dur=1700;this.rolls=[1,1];this.final=null;
    this.ps[0].x=W*0.3;this.ps[1].x=W*0.7;this.ps.forEach(p=>{p.y=H*0.62;p.r=46;});},
  step(dt,t){if(this.t0==null)this.t0=t;const e=t-this.t0;
    if(e<this.dur){this.rolls=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];return false;}
    if(!this.final){this.final=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
      if(this.final[0]===this.final[1]){this.final=null;this.t0=t;return false;}// reroll on tie
      this.rolls=this.final;const w=this.final[0]>this.final[1]?0:1;this.winner=this.ps[w];burst(this.ps[w].x,H*0.34,this.ps[w].color);}
    return t-this.t0>this.dur+1400;},
  draw(){for(let i=0;i<2;i++){const p=this.ps[i];drawBlob(p,p.x,p.y,p.r);
    ctx.fillStyle=this.winner===p?"#9ece6a":"#c0caf5";ctx.font='700 clamp(40px,6vw,90px) Space Grotesk';
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(this.rolls[i],p.x,H*0.34);}}};}

const GAMES=[Race,Royale,Coin,Dice];
let g=null, phase="play", resultAt=0, last=performance.now();
function nextGame(){g=pick(GAMES)();g.init();phase="play";
  document.getElementById("title").textContent=g.title;document.getElementById("sub").textContent=g.sub;}
function loop(now){const dt=now-last;last=now;
  ctx.clearRect(0,0,W,H);
  if(g){
    if(phase==="play"){ if(g.step(dt,now)){phase="result";resultAt=now;} }
    g.draw();drawParticles();
    if(phase==="result"){
      const win=g.winner;
      if(win){ctx.fillStyle="rgba(22,22,30,.55)";ctx.fillRect(0,H*0.42,W,H*0.16);
        ctx.fillStyle=win.color;ctx.font='700 clamp(30px,5vw,64px) Space Grotesk';ctx.textAlign="center";ctx.textBaseline="middle";
        ctx.fillText(win.name+" wins",W/2,H*0.5);}
      if(now-resultAt>3400)nextGame();
    }
  }
  requestAnimationFrame(loop);
}
loadNames().then(()=>{nextGame();requestAnimationFrame(loop);});
</script>
</body>
</html>
