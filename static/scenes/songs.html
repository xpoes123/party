<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>songs scene</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:transparent;color:#c0caf5;font-family:"Inter",system-ui,sans-serif;padding:6vh 7vw}
.head{display:flex;align-items:baseline;gap:16px;margin-bottom:4vh}
.title{font-family:"Space Grotesk";font-weight:600;font-size:clamp(28px,3.6vw,52px);letter-spacing:-.02em;
  background:linear-gradient(100deg,#7aa2f7,#bb9af7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:"JetBrains Mono";color:#565f89;font-size:clamp(12px,1.2vw,16px);letter-spacing:.1em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:20px;background:#1f2335;border:1px solid #2a2f45;
  border-radius:8px;padding:clamp(14px,2vh,20px) clamp(18px,2.5vw,28px)}
.row.now{border-color:rgba(158,206,106,.5)}
.num{font-family:"JetBrains Mono";font-weight:500;font-size:clamp(20px,2.2vw,34px);color:#414868;
  min-width:1.4em;text-align:center}
.now .num{color:#9ece6a}
.art{width:clamp(48px,5vw,76px);height:clamp(48px,5vw,76px);border-radius:6px;flex:none;
  object-fit:cover;background:#24283b}
.info{flex:1;min-width:0}
.t{font-family:"Space Grotesk";font-weight:500;font-size:clamp(20px,2.2vw,34px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.by{color:#565f89;font-size:clamp(12px,1.2vw,16px);margin-top:3px}
.tag{font-family:"JetBrains Mono";font-weight:500;color:#9ece6a;font-size:clamp(12px,1.2vw,16px);
  letter-spacing:.14em;text-transform:uppercase}
.empty{color:#565f89;font-family:"Space Grotesk";font-size:clamp(22px,2.6vw,36px);margin-top:8vh;text-align:center}
</style>
</head>
<body>
<div class="head"><span class="title">up next</span><span class="sub">request from your phone</span></div>
<div class="list" id="list"><p class="empty">no requests yet — add one!</p></div>
<script>
function row(t, idx, now){
  return '<div class="row'+(now?' now':'')+'">'+
    '<div class="num">'+(now?'▶':idx)+'</div>'+
    (t.art?'<img class="art" src="'+esc(t.art)+'">':'')+
    '<div class="info"><div class="t">'+esc(t.title)+'</div>'+
      (t.artist||t.by?'<div class="by">'+esc(t.artist||t.by)+'</div>':'')+'</div>'+
    (now?'<div class="tag">now playing</div>':'')+'</div>';
}
async function load(){
  const l=document.getElementById("list");
  const st=await (await fetch("/music/status")).json();
  if(st.connected){
    const d=await (await fetch("/music/now")).json();
    const rows=[];
    if(d.playing) rows.push(row(d.playing,0,true));
    (d.queue||[]).forEach((t,i)=>rows.push(row(t,i+1,false)));
    l.innerHTML = rows.length ? rows.join("") : '<p class="empty">nothing playing — request a song!</p>';
    return;
  }
  const songs=await (await fetch("/songs")).json();
  l.innerHTML = songs.length ? songs.slice(0,8).map((s,i)=>row(s,i+1,i===0)).join("")
    : '<p class="empty">no requests yet — add one from your phone!</p>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
load();
setInterval(load,3000);
</script>
</body>
</html>
