<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poll scene</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:transparent;color:#c0caf5;font-family:"Inter",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:6vh 6vw}
.wrap{width:100%;max-width:1100px}
.kick{font-family:"JetBrains Mono";text-align:center;font-size:clamp(12px,1.2vw,16px);letter-spacing:.24em;text-transform:uppercase;color:#565f89;margin-bottom:16px}
.q{font-family:"Space Grotesk";font-weight:600;font-size:clamp(32px,4.6vw,62px);text-align:center;
  line-height:1.04;letter-spacing:-.02em;margin-bottom:6vh}
.bars{display:flex;flex-direction:column;gap:18px}
.bar{position:relative;height:clamp(66px,10vh,112px);border-radius:8px;overflow:hidden;
  background:#1f2335;border:1px solid #2a2f45}
.fill{position:absolute;inset:0;width:0;transition:width .8s cubic-bezier(.22,1,.36,1)}
.fill.a{background:rgba(122,162,247,.28)}
.fill.b{background:rgba(187,154,247,.28)}
.lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,3vw,40px);z-index:2}
.opt{font-family:"Space Grotesk";font-weight:500;font-size:clamp(22px,2.8vw,40px)}
.pct{font-family:"JetBrains Mono";font-weight:500;font-size:clamp(24px,3vw,44px);
  font-variant-numeric:tabular-nums;color:#a9b1d6}
.tot{font-family:"JetBrains Mono";text-align:center;color:#565f89;margin-top:26px;font-size:clamp(12px,1.2vw,17px);letter-spacing:.08em;text-transform:uppercase}
.empty{text-align:center;color:#565f89;font-family:"Space Grotesk";font-size:clamp(22px,2.6vw,36px)}
</style>
</head>
<body>
<div class="wrap" id="wrap"><p class="empty">no active polls right now…</p></div>
<script>
let polls=[], idx=0;
function render(){
  const w=document.getElementById("wrap");
  if(!polls.length){ w.innerHTML='<p class="empty">no active polls right now…</p>'; return; }
  const p=polls[idx%polls.length];
  const tot=p.a+p.b, pa=tot?Math.round(p.a/tot*100):0, pb=tot?100-pa:0;
  w.innerHTML =
    '<div class="kick">this or that · vote on your phone</div>'+
    '<div class="q">'+esc(p.question)+'</div>'+
    '<div class="bars">'+
      bar("a",p.opt_a,pa)+bar("b",p.opt_b,pb)+
    '</div>'+
    '<div class="tot">'+tot+' vote'+(tot===1?'':'s')+'</div>';
  // animate fills after paint
  requestAnimationFrame(()=>{
    w.querySelector(".fill.a").style.width=Math.max(pa,tot?6:0)+"%";
    w.querySelector(".fill.b").style.width=Math.max(pb,tot?6:0)+"%";
  });
}
function bar(k,label,pct){
  return '<div class="bar"><div class="fill '+k+'"></div>'+
    '<div class="lab"><span class="opt">'+esc(label)+'</span><span class="pct">'+pct+'%</span></div></div>';
}
async function load(){ polls=await (await fetch("/polls")).json(); render(); }
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
load();
setInterval(load,3000);
setInterval(()=>{ if(polls.length>1){ idx++; render(); } },8000);  // cycle multiple polls
</script>
</body>
</html>
