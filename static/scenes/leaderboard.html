<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokyo-night.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:transparent;color:var(--text);font-family:"Inter",system-ui,sans-serif;padding:6vh 8vw}
.head{text-align:center;margin-bottom:5vh}
.title{font-family:"Space Grotesk";font-weight:600;font-size:clamp(30px,4.4vw,60px);letter-spacing:-.02em;
  background:linear-gradient(100deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:"JetBrains Mono";font-size:clamp(12px,1.2vw,16px);color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:10px}
.list{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:20px;background:#1f2335;border:1px solid #2a2f45;border-radius:8px;
  padding:clamp(12px,1.8vh,18px) clamp(18px,2.4vw,28px)}
.rk{font-family:"JetBrains Mono";font-weight:500;font-size:clamp(20px,2.2vw,32px);color:#414868;min-width:1.6em}
.nm{flex:1;font-family:"Space Grotesk";font-weight:500;font-size:clamp(20px,2.4vw,36px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{font-family:"Space Grotesk";font-weight:700;font-size:clamp(22px,2.6vw,38px);color:var(--text)}
.pts small{font-family:"JetBrains Mono";font-weight:400;font-size:.5em;color:var(--muted);margin-left:6px;letter-spacing:.05em}
.wins{font-family:"JetBrains Mono";font-size:clamp(11px,1.1vw,14px);color:var(--muted);min-width:5em;text-align:right}
.row.r1{border-color:#5b4a1d;background:linear-gradient(100deg,rgba(224,175,104,.10),#1f2335)}
.row.r1 .rk{color:#e0af68}
.row.r2{border-color:#3a4056}.row.r2 .rk{color:#9aa5b8}
.row.r3{border-color:#5c3d20}.row.r3 .rk{color:#cd853f}
.empty{text-align:center;color:var(--muted);font-family:"Space Grotesk";font-size:clamp(22px,2.6vw,36px);margin-top:8vh}
</style>
</head>
<body>
<div class="head"><div class="title">arena leaderboard</div><div class="sub">points = size of the field you beat</div></div>
<div class="list" id="list"></div>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){
  let d=[]; try{ d=await (await fetch("/arena/leaderboard")).json(); }catch(e){}
  const l=document.getElementById("list");
  if(!d.length){ l.innerHTML='<p class="empty">no games played yet…</p>'; return; }
  l.innerHTML=d.map((p,i)=>
    '<div class="row'+(i<3?' r'+(i+1):'')+'"><div class="rk">'+(i+1)+'</div>'+
    '<div class="nm">'+esc(p.name)+'</div>'+
    '<div class="wins">'+p.wins+' win'+(p.wins===1?'':'s')+'</div>'+
    '<div class="pts">'+p.points+'<small>pts</small></div></div>').join("");
}
load();
setInterval(load,3000);
</script>
</body>
</html>
