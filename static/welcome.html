<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the party — welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/static/qrcode.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:
  radial-gradient(1200px 700px at 80% -10%, rgba(122,162,247,.12), transparent 60%),
  radial-gradient(1000px 700px at 0% 110%, rgba(187,154,247,.09), transparent 55%),
  #1a1b26;color:#c0caf5;font-family:"Inter",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 4vw;text-align:center}
.kick{font-family:"JetBrains Mono";font-size:clamp(13px,1.3vw,18px);letter-spacing:.34em;text-transform:uppercase;color:#565f89}
h1{font-family:"Space Grotesk";font-weight:600;font-size:clamp(48px,8vw,104px);line-height:.95;margin:.12em 0 .28em;letter-spacing:-.02em;
  background:linear-gradient(100deg,#7aa2f7,#bb9af7);-webkit-background-clip:text;background-clip:text;color:transparent}
.qrbox{background:#fff;padding:clamp(16px,2vw,24px);border-radius:12px;border:1px solid #2a2f45}
.qrbox img,.qrbox canvas,.qrbox table{display:block;width:clamp(220px,26vw,340px);height:auto;image-rendering:pixelated}
.scan{font-family:"Space Grotesk";font-weight:500;font-size:clamp(20px,2.4vw,34px);margin-top:28px;color:#a9b1d6}
.count{font-family:"JetBrains Mono";margin-top:12px;font-size:clamp(13px,1.3vw,18px);color:#565f89;letter-spacing:.1em;text-transform:uppercase}
.count b{color:#c0caf5;font-family:"Space Grotesk";font-weight:600;font-size:1.4em}
.ticker{position:fixed;bottom:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:center;
  font-family:"JetBrains Mono";font-weight:500;font-size:clamp(14px,1.5vw,22px);letter-spacing:.06em;
  background:linear-gradient(180deg,transparent,rgba(22,22,30,.7));color:#9ece6a}
.ticker.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="kick">you're invited</div>
<h1>the&nbsp;party</h1>
<div class="qrbox" id="qrbox"></div>
<div class="scan">scan to join the graph</div>
<div class="count"><b id="n">0</b> people here</div>
<div class="ticker" id="ticker"></div>
<script>
// QR encodes ?url= (final domain) or this page's origin by default
const joinUrl = new URLSearchParams(location.search).get("url") || location.origin + "/";
const qr=qrcode(0,"M"); qr.addData(joinUrl); qr.make();
document.getElementById("qrbox").innerHTML=qr.createImgTag(8,0);

let known=null;
async function load(){
  const s=await (await fetch("/state")).json();
  document.getElementById("n").textContent=s.guests.length;
  const now=new Set(s.guests.map(g=>g.id));
  if(known){
    const arrived=s.guests.filter(g=>!known.has(g.id));
    if(arrived.length) announce(arrived.map(g=>g.name).join(" & ")+" just arrived");
  } else { announce("scan the code · tap your name to check in"); }
  known=now;
}
function announce(msg){ const t=document.getElementById("ticker");
  t.textContent=msg; t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop"); }
load();
setInterval(load,3000);
</script>
</body>
</html>
