<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16301f">
<title>RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* Guests see this page, so it owns its look: the invite is a playing card lying on felt. */
  :root {
    --felt: #16301f; --felt-2: #234a32; --card: #f4eddd; --card-2: #ebe1cb; --ink: #1c1814; --ink-2: #4a4137;
    --mute: #8a7c68; --rule: rgba(28, 24, 20, .14); --red: #b01c22;
    --r: 22px; --pad: 24px; color-scheme: light; --glow: rgba(255, 214, 140, .22); --field: #fffaf0;
    --fell: 'IM Fell English', Georgia, serif; --sc: 'IM Fell English SC', Georgia, serif; --sans: 'Archivo Narrow', 'Arial Narrow', sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--felt); }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); -webkit-font-smoothing: antialiased;
    font: 400 17px/1.5 var(--sans);
    background:
      radial-gradient(70% 40% at 50% 0%, var(--glow), transparent 70%),
      radial-gradient(120% 90% at 50% 40%, var(--felt-2), var(--felt) 70%, #0c1c12);
    background-attachment: fixed;
  }
  body::before {  /* felt nap */
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  main { position: relative; max-width: 520px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom)); }

  .card { position: relative; background: var(--card); border-radius: var(--r); padding: 76px var(--pad) 76px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 2px 3px rgba(0, 0, 0, .25), 0 30px 60px -20px rgba(0, 0, 0, .7);
    background-image: radial-gradient(120% 80% at 50% 0%, #fbf6ea, transparent 60%); }
  .card::before { content: ""; position: absolute; inset: 9px; border: 1px solid var(--rule); border-radius: 15px; pointer-events: none; }
  .idx { position: absolute; top: 18px; left: 18px; display: flex; flex-direction: column; align-items: center; color: var(--red);
    font: 400 28px/.9 var(--fell); }
  .idx small { font-size: 22px; line-height: 1; margin-top: 2px; }
  .idx.br { top: auto; left: auto; bottom: 18px; right: 18px; transform: rotate(180deg); }

  .cover { display: block; width: 100%; height: auto; border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(28, 24, 20, .25), 0 0 0 5px var(--card), 0 0 0 6px var(--rule); }
  .eyebrow { margin-top: 30px; text-align: center; color: var(--ink); font: 700 17px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
  .eyebrow .who { display: inline-block; padding: 3px 9px 2px; margin-right: 2px; background: var(--red); color: #fff; border-radius: 3px; transform: rotate(-2deg); }
  h1 { margin: 12px 0 0; text-align: center; font: 400 clamp(42px, 12.5vw, 62px)/.95 var(--sc); letter-spacing: -.01em; text-wrap: balance; }
  .orn { display: flex; align-items: center; gap: 12px; margin: 18px auto 0; max-width: 300px; color: var(--ink-2); font-size: 14px; letter-spacing: .5em; }
  .orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .orn b { font-weight: 400; } .orn b:nth-child(even) { color: var(--red); }
  .blurb { margin: 20px 0 0; text-align: center; font: italic 400 19px/1.45 var(--fell); color: var(--ink-2); white-space: pre-line; }

  .facts { margin-top: 28px; border-top: 1px solid var(--rule); }
  .fact { display: grid; grid-template-columns: 78px 1fr; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .fact .k { padding-top: 3px; color: var(--mute); font: 600 12px/1.4 var(--sans); letter-spacing: .2em; text-transform: uppercase; }
  .fact .v { font: 400 21px/1.25 var(--fell); }
  .fact small { display: block; margin-top: 4px; color: var(--mute); font: 400 15px/1.35 var(--sans); }
  .fact a { color: inherit; text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 3px; }
  .cal { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .cal a { text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule); background: var(--card-2);
    color: var(--ink); font: 600 13px/1 var(--sans); letter-spacing: .06em; }
  .cal a:active { background: var(--ink); color: var(--card); }

  .ask { margin-top: 30px; text-align: center; }
  .ask h2 { margin: 0; font: italic 400 26px/1 var(--fell); }
  .fields { display: grid; gap: 10px; margin: 18px 0 4px; text-align: left; }
  .fields input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--field);
    color: var(--ink); font: 400 17px var(--sans); outline: none; }
  .fields input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(176, 28, 34, .15); }

  /* RSVP buttons are poker chips */
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 20px; }
  .chip { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink-2);
    font: 600 13px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase;
    display: flex; flex-direction: column; align-items: center; gap: 12px; -webkit-tap-highlight-color: transparent; transition: opacity .25s; }
  .chip i { position: relative; width: min(82px, 21vw); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
    font: normal 400 28px/1 var(--fell); color: #fff;
    background: radial-gradient(circle, var(--c) 0 56%, transparent 57%), repeating-conic-gradient(from 12deg, var(--edge) 0 16deg, var(--c) 16deg 45deg);
    box-shadow: 0 0 0 2px var(--c), 0 6px 0 -1px var(--rim), 0 12px 18px -6px rgba(0, 0, 0, .45);
    transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
  .chip i::after { content: ""; position: absolute; inset: 24%; border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, .5); }
  .chip:active i { transform: scale(.94); }
  .going { --c: #b01c22; --edge: #f4eddd; --rim: #6e0f13; }
  .maybe { --c: #24527e; --edge: #f4eddd; --rim: #15324e; }
  .no    { --c: #24201c; --edge: #b9ab92; --rim: #000; }
  .picked .chip { opacity: .35; }
  .picked .chip.on { opacity: 1; color: var(--ink); }
  .chip.on i { transform: translateY(-6px) rotate(-16deg); }
  .msg { margin-top: 18px; font: italic 400 20px/1.3 var(--fell); color: var(--red); }
  .msg:empty { margin: 0; }
  .msg.err { font: 500 15px/1.4 var(--sans); }

  .plus { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--rule); text-align: center; }
  .plus h2 { margin: 0; font: italic 400 22px/1 var(--fell); }
  .plus .v { font: 400 20px/1.3 var(--fell); }
  .plus .v small { color: var(--mute); font: 400 14px var(--sans); }
  .plus .msg a { color: var(--ink); word-break: break-all; font: 500 14px/1.4 var(--sans); }
  .pbtn { margin-top: 8px; padding: 12px 22px; border: 0; border-radius: 999px; background: var(--ink); color: var(--card); cursor: pointer;
    font: 600 14px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; }
  .eta { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 16px; }
  .eta button { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--ink-2);
    font: 500 14px/1 var(--sans); cursor: pointer; }
  .eta button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .eta span { width: 100%; color: var(--ink); font: italic 400 18px/1.3 var(--fell); }
  #etaPick { display: flex; gap: 6px; justify-content: center; width: 100%; margin-top: 6px; }
  #etaPick[hidden] { display: none; }
  #etaPick input { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--field); color: var(--ink); font: 500 16px var(--sans); }
  .person .late { margin-top: -3px; color: var(--red); font: 600 11px/1 var(--sans); }
  section { margin-top: 34px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
  .head h2 { margin: 0; font: italic 400 24px/1 var(--fell); }
  .head span { color: var(--mute); font: 600 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 16px 6px; margin-top: 16px; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; font: 500 14px/1.2 var(--sans); color: var(--ink-2); }
  .person span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 400 22px/1 var(--sc);
    background: var(--av); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--rule); }
  .person.maybe .av { opacity: .5; }
  .person.pending .av { background: transparent; color: var(--mute); box-shadow: none; border: 1.5px dashed rgba(28, 24, 20, .3); }
  .person.pending { color: var(--mute); }
  .host { margin-top: 36px; text-align: center; font: italic 400 18px/1.3 var(--fell); color: var(--ink-2); }

  /* noir: a case file in a dark room. Black card, blood red, typewriter copy. */
  [data-theme="noir"] {
    --felt: #070606; --felt-2: #1d0708; --glow: rgba(160, 16, 24, .28); --card: #100d0d; --card-2: #1c1716; --field: #0a0808;
    --ink: #ece4d6; --ink-2: #b9ae9f; --mute: #7d726a; --rule: rgba(236, 228, 214, .13); --red: #c3141f; color-scheme: dark;
    --fell: 'Special Elite', 'Courier New', monospace; --sc: 'Gloock', Georgia, serif; --sans: 'Special Elite', 'Courier New', monospace;
  }
  [data-theme="noir"] body::before { opacity: .22; }
  [data-theme="noir"] .card { background-image: radial-gradient(120% 70% at 50% 0%, #1a1312, transparent 60%);
    box-shadow: 0 0 0 1px rgba(195, 20, 31, .35), 0 30px 80px -20px #000, 0 0 120px -40px rgba(195, 20, 31, .5); }
  [data-theme="noir"] .card::before { border-color: rgba(195, 20, 31, .28); }
  [data-theme="noir"] h1 { color: var(--red); font-style: italic; text-shadow: 0 2px 0 #4a0508; }
  [data-theme="noir"] .idx { font: 400 13px/1.1 var(--sans); letter-spacing: .12em; top: 28px; left: 26px; }
  [data-theme="noir"] .idx.br { top: auto; left: auto; bottom: 28px; right: 26px; }
  [data-theme="noir"] .idx small { display: none; }
  [data-theme="noir"] .orn b, [data-theme="noir"] .orn b:nth-child(even) { color: var(--red); }
  [data-theme="noir"] .blurb, [data-theme="noir"] .msg { font-style: normal; font-size: 17px; }
  [data-theme="noir"] .fact .v { font-size: 18px; }
  [data-theme="noir"] .head h2, [data-theme="noir"] .ask h2, [data-theme="noir"] .plus h2 { font: italic 400 26px/1 'Gloock', serif; }
  [data-theme="noir"] .host { font-size: 15px; }
  [data-theme="noir"] .going { --c: #a3101a; --edge: #ece4d6; --rim: #4a0508; }
  [data-theme="noir"] .maybe { --c: #4a4542; --edge: #ece4d6; --rim: #1f1c1a; }
  [data-theme="noir"] .no    { --c: #0a0808; --edge: #6b5f58; --rim: #000; }
  [data-theme="noir"] .av { box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--rule); }
  [data-theme="noir"] .person.pending .av { border-color: rgba(236, 228, 214, .25); }
  [data-theme="noir"] .stamp { display: block; }
  [data-theme="noir"] .eyebrow { font-size: 15px; letter-spacing: .04em; }
  /* noir RSVP buttons: evidence tags */
  .tg { position: relative; display: block; width: 100%; max-width: 104px; padding: 26px 6px 32px; color: #1a1412; background: #d8ccb2;
    clip-path: polygon(22% 0, 78% 0, 100% 20%, 100% 100%, 0 100%, 0 20%); font: 400 15px/1.2 var(--sans); letter-spacing: .04em; text-transform: none;
    transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), background .25s; }
  .tg::before { content: ""; position: absolute; top: 9px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
    background: var(--card); box-shadow: 0 0 0 2px #a8997c; }
  .tg b { display: block; margin-bottom: 6px; color: var(--red); font: 400 10.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; }
  .going .tg { transform: rotate(-4deg); } .maybe .tg { transform: rotate(2deg); } .no .tg { transform: rotate(-1deg); }
  [data-theme="noir"] .chip { filter: drop-shadow(0 10px 12px rgba(0, 0, 0, .6)); }
  [data-theme="noir"] .chip:hover .tg { transform: rotate(0) translateY(-3px); }
  .chip.on .tg { background: #f1e7d1; transform: rotate(0) translateY(-6px); }
  .chip.on .tg::after { content: "FILED"; position: absolute; right: 10px; bottom: 7px; padding: 2px 5px; border: 2px solid var(--red); border-radius: 3px;
    color: var(--red); font: 400 11px/1 var(--sans); letter-spacing: .14em; transform: rotate(-14deg); opacity: .9; }
  .stamp { display: none; position: absolute; top: 22px; right: 22px; transform: rotate(8deg); padding: 4px 10px; border: 2px solid var(--red);
    border-radius: 4px; color: var(--red); font: 400 13px/1 var(--sans); letter-spacing: .2em; opacity: .85; }

  .rise { animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes deal { from { opacity: 0; transform: translateY(40px) rotate(-3deg) scale(.97); } }
  .card { animation: deal .9s cubic-bezier(.2, .8, .2, 1) both; }
  .settled .rise, .settled .card { animation: none; }
  @media (prefers-reduced-motion: reduce) { .rise, .card { animation: none; } .chip i { transition: none; } }
  @media (min-width: 600px) { main { padding-top: 48px; } :root { --pad: 40px; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const [, , slug, token] = location.pathname.split('/');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CHIPS = { going: ["I'm in", '✓'], maybe: ['Maybe', '?'], no: ["Can't", '✕'] };
// Per-event look and copy (events.theme). '' = the card-table theme. Each theme fills the same sprite slots:
// button (the RSVP choices), orn (divider glyphs), idx (corner marks), plus its CSS block above.
const chipBtn = (k, label, glyph) => `<i>${glyph}</i>${label}`;
const tagBtn = (k, label) => `<span class="tg"><b>Exhibit ${{ going: 'A', maybe: 'B', no: 'C' }[k]}</b>${label}</span>`;
const THEMES = {
  '': { fonts: 'IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Archivo+Narrow:wght@400;500;600;700', invited: n => `${n}, you're invited`,
    button: chipBtn, orn: ['♠', '♥', '♣', '♦'], table: 'At the table', pending: 'Invited', idx: d => [d ? d.getDate() : 'A', '♦'],
    done: { going: "You're in. See you at the table.", maybe: 'Marked maybe. Change it any time.', no: "Sorry you'll miss it." } },
  noir: { fonts: 'Gloock&family=Special+Elite', invited: n => `${n}, you're a suspect`,
    button: tagBtn, orn: ['†', '†', '†'], table: 'The suspects', pending: 'Still at large',
    idx: d => [d ? `CASE NO. ${d.getMonth() + 1}${String(d.getDate()).padStart(2, '0')}` : 'CASE FILE', ''],
    done: { going: "You're on the list. Trust no one.", maybe: "Noted. We'll be watching.", no: 'Suspicious. Very suspicious.' } },
};
let T = THEMES[''];
function useTheme(name) {
  T = THEMES[name] || THEMES[''];
  document.documentElement.dataset.theme = name || 'card';
  if (!document.getElementById('tf')) document.head.insertAdjacentHTML('beforeend',
    `<link id="tf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${T.fonts}&display=swap">`);
}
const AV = ['#b01c22', '#24527e', '#2f5b3f', '#6a4a86', '#9a6a1e', '#3d4f63', '#8a3a5a', '#24201c'];
const app = document.getElementById('app');
let ME = null;

let LATE = {};  // first name -> 'HH:MM'

const faces = (names, cls) => names.map(n => {
  const h = [...n].reduce((a, c) => a * 31 + c.charCodeAt(0) | 0, 0);
  return `<div class="person ${cls}"><div class="av" style="--av:${AV[Math.abs(h) % AV.length]}">${esc(n[0] || '?')}</div><span>${esc(n.split(' ')[0])}</span>${cls === '' && LATE[n] ? `<small class="late">~${clock(LATE[n])}</small>` : ''}</div>`;
}).join('');

// Google takes wall-clock times plus ctz; Apple Calendar opens the .ics.
function calLinks(e) {
  const p = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
  const start = new Date(e.at), end = endOf(e);
  const g = 'https://calendar.google.com/calendar/render?' + new URLSearchParams({ action: 'TEMPLATE', text: e.title,
    dates: `${fmt(start)}/${fmt(end)}`, ctz: 'America/New_York', location: e.address, details: location.href });
  return `<div class="cal"><a href="${g}" target="_blank" rel="noopener">+ Google Calendar</a>
    <a href="/api/e/${slug}/cal.ics?t=${encodeURIComponent(token)}">+ Apple Calendar</a></div>`;
}

const t12 = d => d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
function endOf(e) {  // same rule as the .ics: `ends` HH:MM (past midnight rolls over), else 3h
  const s = new Date(e.at);
  if (!e.ends) return new Date(s.getTime() + 3 * 3600e3);
  const d = new Date(`${e.at.slice(0, 10)}T${e.ends}`);
  return d > s ? d : new Date(d.getTime() + 864e5);
}
function whenFact(e, me) {
  if (!e.at) return `<div class="fact"><div class="k">When</div><div class="v">${esc(e.starts)}</div></div>`;
  const d = new Date(e.at);  // 'YYYY-MM-DDTHH:MM' parses as local time
  return `<div class="fact"><div class="k">When</div><div>
    <div class="v">${d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</div>
    <small>${t12(d)}${e.ends ? ' – ' + t12(endOf(e)) : ' onward'}</small>${me ? calLinks(e) : ''}</div></div>`;
}

async function load() {
  const r = await fetch(`/api/e/${slug}` + (token ? `?t=${encodeURIComponent(token)}` : ''));
  if (!r.ok) { app.innerHTML = '<div class="card"><h1>No such event</h1></div>'; return; }
  const { event: e, me, going, maybe, invited, late = {} } = await r.json();
  LATE = late;
  ME = me;
  useTheme(e.theme);
  const ask = !me || me.needs_info;  // open link (number required), or invited without a number (optional)
  document.title = e.title;
  const [rank, suit] = T.idx(e.at ? new Date(e.at) : null);
  const where = e.address
    ? `<div class="v"><a href="https://maps.apple.com/?q=${encodeURIComponent(e.address)}">${esc(e.address.split(',')[0])}</a></div><small>${esc(e.address.split(',').slice(1).join(',').trim())}</small>`
    : `<div class="v">${esc(e.place || 'TBA')}</div><small>Address shown after you RSVP</small>`;
  let i = 0; const rise = () => `rise" style="--i:${i++}`;
  app.innerHTML = `<div class="card">
    <div class="idx">${rank}<small>${suit}</small></div><div class="idx br">${rank}<small>${suit}</small></div>
    <div class="stamp">CONFIDENTIAL</div>
    ${e.cover ? `<img class="cover ${rise()}" src="${esc(e.cover)}" alt="">` : ''}
    <div class="eyebrow ${rise()}">${me ? T.invited(`<b class="who">${esc(me.name.split(' ')[0])}</b>`) : "You're invited"}</div>
    <h1 class="${rise()}">${esc(e.title)}</h1>
    <div class="orn ${rise()}">${T.orn.map(o => `<b>${o}</b>`).join('')}</div>
    ${e.blurb ? `<p class="blurb ${rise()}">${esc(e.blurb)}</p>` : ''}
    <div class="facts ${rise()}">
      ${whenFact(e, me)}
      <div class="fact"><div class="k">Where</div><div>${where}</div></div>
    </div>
    <div class="ask ${rise()}">
      <h2>${me?.status ? 'Your answer' : 'Are you in?'}</h2>
      ${ask ? `<div class="fields"><input id="name" placeholder="Your full name" autocomplete="name" value="${esc(me?.name || '')}">
        <input id="phone" placeholder="${me ? 'Phone (optional, for a confirmation text)' : 'Phone number'}" type="tel" autocomplete="tel"></div>` : ''}
      <div class="chips ${me?.status ? 'picked' : ''}">${Object.entries(CHIPS).map(([k, [l, g]]) =>
        `<button class="chip ${k} ${me?.status === k ? 'on' : ''}" onclick="send('${k}')">${T.button(k, l, g)}</button>`).join('')}</div>
      <div id="msg" class="msg">${me?.status ? T.done[me.status] : ''}</div>
      ${me?.status === 'going' ? `<div class="eta">${me.eta
        ? `<span>Arriving around ${clock(me.eta)}</span><button onclick="askEta()">Change time</button><button onclick="setEta('')">I'll be on time</button>`
        : `<button onclick="askEta()">Arriving late?</button>`}
        <div id="etaPick" hidden><input type="time" id="etaIn" value="${esc(me.eta || later(e.at))}"><button class="on" onclick="setEta(document.getElementById('etaIn').value)">Save</button></div></div>` : ''}
    </div>
    ${me && (me.plus_left || me.guests.length) ? `<div class="plus ${rise()}">
      ${me.guests.map(g => `<div class="v">+1 · ${esc(g)} <small>on the list</small></div>`).join('')}
      ${me.plus_left && !me.needs_info ? `<h2>Bringing someone?</h2><div class="fields"><input id="pname" placeholder="Their name">
        <input id="pphone" placeholder="Their phone number" type="tel"></div>
        <button class="pbtn" onclick="addPlus()">Add my +1</button>` : me.plus_left ? `<div class="v">You can bring a +1. Add them here after you RSVP.</div>` : ''}
      <div id="pmsg" class="msg"></div></div>` : ''}
    ${going.length || maybe.length ? `<section class="${rise()}"><div class="head"><h2>${T.table}</h2>
      <span>${going.length} in${maybe.length ? ` · ${maybe.length} maybe` : ''}</span></div>
      <div class="people">${faces(going, '')}${faces(maybe, 'maybe')}</div></section>` : ''}
    ${invited.length ? `<section class="${rise()}"><div class="head"><h2>${T.pending}</h2><span>${invited.length} yet to reply</span></div>
      <div class="people">${faces(invited, 'pending')}</div></section>` : ''}
    ${e.host ? `<div class="host ${rise()}">Hosted by ${esc(e.host)}</div>` : ''}
  </div>`;
}

async function send(status) {
  const f = id => document.getElementById(id)?.value;
  const body = { t: token, status, name: f('name'), phone: f('phone') };
  const r = await fetch(`/api/e/${slug}/rsvp`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const msg = document.getElementById('msg');
  if (!r.ok) { msg.className = 'msg err'; msg.textContent = (await r.json()).detail || 'Something went wrong'; return; }
  const { token: t } = await r.json();
  if (!token) { location.replace(`/e/${slug}/${t}`); return; }  // personal link from now on
  app.classList.add('settled');
  load();
}
const clock = hm => new Date(`2000-01-01T${hm}`).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
const later = at => at ? new Date(new Date(at).getTime() + 3600e3).toTimeString().slice(0, 5) : '20:00';  // default: an hour in
function askEta() { document.getElementById('etaPick').hidden = false; document.getElementById('etaIn').focus(); }
async function setEta(v) {
  await fetch(`/api/e/${slug}/eta`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, eta: v }) });
  app.classList.add('settled');
  load();
}
async function addPlus() {
  const f = id => document.getElementById(id).value, pmsg = document.getElementById('pmsg');
  const r = await fetch(`/api/e/${slug}/plusone`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ t: token, name: f('pname'), phone: f('pphone') }) });
  const d = await r.json();
  if (!r.ok) { pmsg.className = 'msg err'; pmsg.textContent = d.detail || 'Something went wrong'; return; }
  app.classList.add('settled');
  await load();
  const link = `${location.origin}/e/${slug}/${d.token}`;
  document.getElementById('pmsg').innerHTML = `Done. Send them their invite:<br><a href="${link}">${link}</a>`;
  if (navigator.share) navigator.share({ title: document.title, url: link }).catch(() => {});
}
load();
</script>
</body>
